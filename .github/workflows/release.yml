name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: "8.2"

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Create release zip
        run: |
          mkdir -p release
          rsync -av --exclude-from=.distignore . release/hellotext-wordpress/
          cd release
          zip -r hellotext-wordpress.zip hellotext-wordpress

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/hellotext-wordpress.zip
          generate_release_notes: true
