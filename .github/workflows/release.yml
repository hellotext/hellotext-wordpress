name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: "8.2"

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Create release zip
        run: |
          mkdir -p release
          rsync -av --exclude-from=.distignore . release/hellotext/
          cd release
          zip -r hellotext.zip hellotext

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: release/hellotext.zip
          generate_release_notes: true
